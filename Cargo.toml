[package]
name = "ricky-homepage"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A personal homepage with a Rust/WebAssembly futures order book"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pulldown-cmark = "=0.13.4"
regex = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
web-sys = { version = "=0.3.77", features = ["Window", "Document", "Element", "HtmlElement", "Event", "EventTarget", "MessageEvent", "WebSocket", "CloseEvent"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
